<!doctype html>
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />
    <meta name="quiz-build" content="static-native-gluteos-autoplay-audio-20261015-2" />
    <title>Video — Desafío Glúteos Brasileños</title>
    <link rel="preconnect" href="https://gluteosbrasilenos.lat" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #000; }
      body { overflow: hidden; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; }
      #video-error {
        position: absolute; right: 16px; bottom: 48px; left: 16px;
        margin: 0; padding: 12px; color: #fff; background: rgba(0, 0, 0, .85);
        font: 14px/1.5 sans-serif; text-align: center;
      }
      #video-error a { color: #fff; }
      #play-video {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        max-width: calc(100% - 32px); padding: 12px 18px; border: 2px solid #fff;
        border-radius: 12px; background: #000d; color: #fff; cursor: pointer;
        font: bold 16px/1.3 sans-serif; z-index: 1;
      }
      noscript { color: #fff; padding: 20px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <video
      id="vid-6aa9ec0b2867174ee33fcba6"
      src="https://gluteosbrasilenos.lat/vsl-video.mp4"
      controls
      autoplay
      playsinline
      preload="auto"
      aria-label="Presentación de entrenamiento — Desafío Glúteos Brasileños"
    >
      Tu navegador no permite reproducir este video.
      <a href="https://gluteosbrasilenos.lat/vsl-video.mp4" target="_blank" rel="noopener">Abrir el video</a>
    </video>
    <button id="play-video" type="button" hidden>▶ Reproducir con sonido</button>
    <!-- Contrato con la página del cuestionario: se muestra al terminar el video. -->
    <div
      id="liberar-plano-vsl"
      class="liberar-plano-vsl"
      aria-hidden="true"
      style="display: none; position: absolute; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none"
    ></div>
    <p id="video-error" hidden>
      No se pudo cargar el video.
      <a href="https://gluteosbrasilenos.lat/vsl-video.mp4" target="_blank" rel="noopener">Abrir el video directamente</a>.
    </p>
    <noscript>Activa JavaScript para continuar al finalizar el video.</noscript>
    <script>
      (function () {
        "use strict";
        // Identificador conservado para la integración con el cuestionario.
        var playerId = "vid-6aa9ec0b2867174ee33fcba6";
        var video = document.getElementById(playerId);
        var gate = document.getElementById("liberar-plano-vsl");
        var errorMessage = document.getElementById("video-error");
        var playButton = document.getElementById("play-video");
        var played = false;
        var revealed = false;
        var milestones = new Set();

        function notify(type, extra) {
          if (window.parent === window) return;
          window.parent.postMessage(
            Object.assign({ source: "quiz-vturb-v1", playerId: playerId, type: type }, extra || {}),
            window.location.origin
          );
        }

        function ready() {
          errorMessage.hidden = true;
          notify("ready");
        }

        function reportProgress() {
          var time = Number(video.currentTime);
          var duration = Number(video.duration);
          if (!Number.isFinite(time) || !Number.isFinite(duration) || duration <= 0) return;
          [25, 50, 75, 90, 100].forEach(function (percent) {
            if ((time / duration) * 100 >= percent && !milestones.has(percent)) {
              milestones.add(percent);
              notify("milestone", { percent: percent });
            }
          });
        }

        function revealPlan() {
          if (revealed) return;
          revealed = true;
          gate.style.display = "block";
          notify("content-revealed", { gate: "liberar-plano-vsl" });
        }

        function startPlayback() {
          video.muted = false;
          var attempt = video.play();
          if (attempt && typeof attempt.catch === "function") {
            attempt.catch(function () {
              if (!video.error) playButton.hidden = false;
            });
          }
        }

        playButton.addEventListener("click", startPlayback);
        video.addEventListener("playing", function () {
          playButton.hidden = true;
        });
        video.addEventListener("loadedmetadata", ready);
        video.addEventListener("canplay", ready);
        video.addEventListener("play", function () {
          if (played) return;
          played = true;
          notify("play");
        });
        video.addEventListener("timeupdate", function () {
          if (!video.seeking && !video.paused) reportProgress();
        });
        video.addEventListener("ended", function () {
          reportProgress();
          revealPlan();
        });
        video.addEventListener("error", function () {
          errorMessage.hidden = false;
          playButton.hidden = true;
          notify("error");
        });
        window.addEventListener("pageshow", function () {
          if (video.readyState >= 1) ready();
          if (video.ended) revealPlan();
        });
        if (video.readyState >= 1) ready();
        startPlayback();
      })();
    </script>
  </body>
</html>
